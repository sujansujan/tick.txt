name: Android CI (Build APK & Unit Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compile tick.txt APK & Run JUnit5 Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JUnit 5 Unit Tests (todo.txt parser, reminders, offline NLP)
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble Release APK (unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Upload Compiled Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tick-txt-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Compiled Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tick-txt-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit5-test-report
          path: app/build/reports/tests/testDebugUnitTest/
