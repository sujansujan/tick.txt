name: Android CI (Build Signed APK & Unit Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compile Signed tick.txt APK & Run JUnit5 Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install Platform 35
        run: |
          yes 2>/dev/null | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JUnit 5 Unit Tests (todo.txt parser, reminders, offline NLP)
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Signed Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Signed Release APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: tick-txt-release-signed-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed Debug APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: tick-txt-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit5-test-report
          path: app/build/reports/tests/testDebugUnitTest/
